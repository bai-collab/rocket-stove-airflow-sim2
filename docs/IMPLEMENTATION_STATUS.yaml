project:
  name: rocket-stove-airflow-sim2
  source_repository: https://github.com/bai-collab/rocket-stove-airflow-sim
  target_repository: https://github.com/bai-collab/rocket-stove-airflow-sim2
  version: Physics v3 + VGPU

status:
  repository_creation: completed
  old_repository_modified: false
  phase: phase_3_vgpu_airflow_core
  live_browser_backend: cpu
  gpu_backend_authority: parity_candidate
  ci: passing

implemented:
  cpu_reference:
    - finite raw straw fuel
    - temperature-driven pyrolysis
    - char generation
    - volatile gas generation
    - oxygen/temperature/mixing-dependent volatile combustion
    - incomplete-combustion smoke formation
    - heat+oxygen+mixing+residence dependent smoke oxidation
    - char oxidation
    - separate mineral matter reservoir
    - ash exposure from mineral reservoir
    - organic/mineral conservation diagnostics
    - carbonization index

  cpu_2d_airflow:
    canvas: 900x560
    solver_cell_px: 12
    build_cell_px: 24
    features:
      - wall/solid mask
      - interactive wall drawing
      - finite straw placement
      - erase tool
      - temperature field
      - oxygen field
      - smoke field
      - volatile gas field
      - exhaust gas field
      - buoyancy
      - semi-Lagrangian velocity advection
      - pressure projection
      - solid-wall no-flow constraint
      - balanced open-boundary inflow/outflow
      - open-boundary fresh-air exchange
      - secondary residence field
      - secondary smoke oxidation
      - airflow tracers
      - wall-safe tracer movement
      - temperature/smoke visualization
      - velocity vectors

  stove_presets:
    - straight vertical riser
    - Z-baffle
    - twin-channel
    - compact sealed oracle

  tests:
    fuel_and_cpu_airflow:
      total: 11
      includes:
        - cold pyrolysis guard
        - oxygen-limited char retention
        - oxygen-rich char oxidation comparison
        - oxygen-alone does not erase smoke
        - secondary smoke oxidation condition test
        - mineral and organic conservation
        - finite-fuel preset
        - ignited raw straw decreases
        - compact sealed stove oxygen decreases
        - smoke does not auto-decay
        - open-boundary inflow/outflow balance
    gpu_parity:
      runtime: vgpu/node + Dawn
      suites:
        - buoyancy CPU/GPU float parity
        - local airflow chain parity
        - global open-boundary flux reduction/correction parity

  frontend:
    - Vite application
    - interactive 2D stove builder
    - Physics v3 metrics panel
    - carbonization indicators
    - advanced airflow diagnostics

  vgpu:
    integration:
      - Vite WGSL loader
      - WGSL TypeScript module declarations
      - strict TypeScript typecheck
      - typed GPU field registry
      - browser VGPU initialization backend
    storage:
      - temperature
      - solid mask
      - velocity ping-pong
      - pressure ping-pong
      - divergence
      - boundary-flux reduction scratch ping-pong
    airflow_compute_pipeline:
      - buoyancy
      - velocity advection
      - divergence
      - pressure Jacobi
      - pressure projection
      - per-cell boundary flux statistics
      - GPU vec2 reduction
      - global boundary flux correction
    fuel_scaffolds:
      - pyrolysis WGSL
      - char oxidation WGSL

validation:
  github_actions:
    cpu_physics_invariants: success
    typescript_strict_typecheck: success
    all_wgsl_validation: success
    vgpu_dawn_gpu_parity: success
    vite_production_build: success
  policy:
    - CPU Physics v3 remains the oracle during migration
    - GPU readback is used in tests/diagnostics, not the hot browser loop
    - no browser backend switch until airflow/scalar integration has a stable state synchronization strategy

next:
  phase_3b_gpu_scalar_fields:
    - add temperature/oxygen/smoke/volatileGas/exhaustGas/residence ping-pong storage
    - migrate scalar advection
    - migrate open-boundary scalar exchange
    - add sealed-component scalar conservation strategy on GPU
    - add CPU/GPU scalar parity tests

  phase_3c_browser_backend_switch:
    - design CPU/GPU state ownership boundary
    - add auto/cpu/gpu selector
    - preserve CPU fallback when WebGPU unavailable
    - avoid per-frame GPU readback for rendering/tracers

  later:
    - migrate Physics v3 fuel transformation
    - migrate tracer particles
    - migrate GPU field rendering
