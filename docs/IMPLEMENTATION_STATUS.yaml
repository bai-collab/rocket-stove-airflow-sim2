    - create typed GPU field registry
    - initialize VGPU browser backend
    - add CPU/GPU backend selector
    - migrate buoyancy compute pass
    - migrate velocity advection compute pass
    - migrate divergence compute pass
    - migrate pressure Jacobi compute pass
    - migrate pressure projection compute pass
    - establish CPU/GPU tolerance-based airflow parity tests

  later:
    - migrate scalar advection
