physics_invariants:
  - tracers visualize airflow; they do not determine oxygen or combustion
  - oxygen cannot directly delete smoke
  - sealed regions cannot receive ambient refill through walls
  - pyrolysis is thermally driven and does not require oxygen
  - char oxidation requires heat and oxygen
  - mineral ash remains separate from carbon char
  - finite fuel cannot generate infinite products
  - raw straw and retained char are stationary fuel fields, not advected gas scalars

