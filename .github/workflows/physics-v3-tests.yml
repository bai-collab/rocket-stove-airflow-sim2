name: Physics v3 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wgsl-validation:
    name: WGSL · ${{ matrix.shader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shader:
          - src/gpu/shaders/airflow/advect-velocity.wgsl
          - src/gpu/shaders/airflow/boundary-flux-correct.wgsl
          - src/gpu/shaders/airflow/boundary-flux-stats.wgsl
          - src/gpu/shaders/airflow/buoyancy.wgsl
          - src/gpu/shaders/airflow/divergence.wgsl
          - src/gpu/shaders/airflow/pressure-jacobi.wgsl
          - src/gpu/shaders/airflow/project.wgsl
          - src/gpu/shaders/airflow/reduce-vec2.wgsl
          - src/gpu/shaders/airflow/reduce-vec4.wgsl
          - src/gpu/shaders/scalar/advect-scalar.wgsl
          - src/gpu/shaders/scalar/open-boundary-exchange.wgsl
          - src/gpu/shaders/scalar/scalar-mass-stats.wgsl
          - src/gpu/shaders/scalar/normalize-scalar.wgsl
          - src/gpu/shaders/fuel/scaffold-check.wgsl
          - src/gpu/shaders/fuel/pyrolysis-pass.wgsl
          - src/gpu/shaders/fuel/volatile-combustion.wgsl
          - src/gpu/shaders/fuel/char-oxidation-pass.wgsl
          - src/gpu/shaders/combustion/cooling-residence.wgsl
          - src/gpu/shaders/combustion/secondary-combustion.wgsl
          - src/gpu/shaders/tracer/tracer-update.wgsl
          - src/gpu/shaders/render/pack-render-state.wgsl
          - src/gpu/shaders/render/field-render.wgsl
          - src/gpu/shaders/render/tracer-render.wgsl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate WGSL
        run: npx --no-install vgpu check "${{ matrix.shader }}"

  test-and-build:
    needs: wgsl-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run CPU physics invariants
        run: npm test

      - name: Typecheck TypeScript and VGPU bindings
        run: npm run typecheck

      - name: Install VGPU software renderer
        run: npx --no-install vgpu install-software-renderer

      - name: Verify VGPU software adapter
        env:
          VGPU_ADAPTER: software
        run: npx --no-install vgpu doctor --pretty

      - name: Run VGPU Physics v3 / tracer / render parity
        env:
          VGPU_ADAPTER: software
        run: npm run test:gpu

      - name: Build Vite app
        run: npm run build
