name: Physics v3 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run CPU physics invariants
        run: npm test

      - name: Typecheck TypeScript and VGPU bindings
        run: npm run typecheck

      - name: Diagnose scalar advection WGSL
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/scalar/advect-scalar.wgsl

      - name: Diagnose scalar boundary WGSL
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/scalar/open-boundary-exchange.wgsl

      - name: Validate all WGSL
        run: npm run check:wgsl

      - name: Run VGPU airflow and scalar parity
        run: npm run test:gpu

      - name: Build Vite app
        run: npm run build
