name: Physics v3 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run CPU physics invariants
        run: npm test

      - name: Typecheck TypeScript and VGPU bindings
        run: npm run typecheck

      - name: Check airflow advect velocity
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/advect-velocity.wgsl
      - name: Check airflow boundary flux correct
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/boundary-flux-correct.wgsl
      - name: Check airflow boundary flux stats
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/boundary-flux-stats.wgsl
      - name: Check airflow buoyancy
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/buoyancy.wgsl
      - name: Check airflow divergence
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/divergence.wgsl
      - name: Check airflow pressure Jacobi
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/pressure-jacobi.wgsl
      - name: Check airflow project
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/project.wgsl
      - name: Check airflow reduce vec2
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/airflow/reduce-vec2.wgsl

      - name: Diagnose scalar advection WGSL
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/scalar/advect-scalar.wgsl
      - name: Diagnose scalar boundary WGSL
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/scalar/open-boundary-exchange.wgsl
      - name: Diagnose fuel module harness
        continue-on-error: true
        run: npx vgpu check src/gpu/shaders/fuel/scaffold-check.wgsl

      - name: Validate all WGSL
        run: npm run check:wgsl

      - name: Run VGPU airflow and scalar parity
        run: npm run test:gpu

      - name: Build Vite app
        run: npm run build
